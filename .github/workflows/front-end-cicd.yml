name: Upload Website

on:
  push:
    branches:
      - main
  workflow_dispatch: # allows a manual re-run from the Actions tab

# OIDC: GitHub requests short-lived AWS credentials on each run; no access keys are stored.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::350760587123:role/github-deploy-cloud-resume
  S3_BUCKET: clauderesume
  CLOUDFRONT_DISTRIBUTION_ID: E3Q46GCI7771EY

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync site to S3
        run: |
          aws s3 sync . "s3://${S3_BUCKET}" --follow-symlinks --delete \
            --exclude '.git/*' --exclude '.github/*' --exclude '*.DS_Store' \
            --exclude '.gitignore' --exclude 'README.md'

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths '/*'
